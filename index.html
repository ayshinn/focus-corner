<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#3a3a3a" />
    <title>focus-corner</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Sidebar"></aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-current-task" data-slot="current-task">No task</div>
          <div class="topbar-intention" data-slot="intention"></div>
          <div class="topbar-meta">
            <div class="topbar-next-event" data-slot="next-event" hidden></div>
            <div class="topbar-weather" data-slot="weather" hidden></div>
            <div class="topbar-clock" data-slot="clock"></div>
          </div>
        </header>
        <section class="stage" data-slot="stage">
          <article class="floating-widget floating-widget-todo" data-slot="todo"></article>
          <article class="floating-widget floating-widget-pomodoro" data-slot="pomodoro"></article>
          <article class="floating-widget floating-widget-music" data-slot="music"></article>
          <article class="floating-widget floating-widget-calendar" data-slot="calendar"></article>
        </section>
      </main>
      <aside class="settings-drawer" aria-label="Settings" data-open="false">
        <header class="settings-drawer-header">
          <h2>Settings</h2>
          <button type="button" class="settings-drawer-close" data-action="close-settings">
            Close
          </button>
        </header>
        <div class="settings-drawer-body" data-slot="settings"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
